services:
  - type: web
    name: orbit-b2b-suite
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: USE_DEMO_FALLBACK
        value: "true"
